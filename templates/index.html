<!DOCTYPE html>
<html>
<head>
    <title>Pothole Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1, h2 {
            text-align: center;
        }
        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid gray;
            padding: 10px;
        }
        th {
            background-color: #f2f2f2;
        }
        img {
            max-width: 150px;
        }
        .video-container {
            text-align: center;
            margin: 20px 0;
        }
        .video-container img {
            width: 80%;
            max-width: 800px;
            height: auto;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Pothole Detection Live Stream</h1>
    <div class="video-container">
        <img src="{{ url_for('video_feed') }}" alt="Live Feed">
    </div>

    <h2>Detection Logs</h2>
    <table>
        <thead>
            <tr>
                <th>Snapshot</th>
                <th>Timestamp</th>
                <th>Coordinates</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td><img src="{{ url_for('static', filename='snapshots/' ~ log.image) }}" alt="Snapshot"></td>
                <td>{{ log.timestamp }}</td>
                <td><a href="https://www.google.com/maps?q={{ log.coords }}" target="_blank">{{ log.coords }}</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
